name: Publish Azure ingestion function
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: edgar-azure
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: azure
    timeout-minutes: 35
    env:
      AZURE_FUNCTION_NAME: ${{ vars.AZURE_FUNCTION_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LAKE_STORAGE: ${{ vars.AZURE_LAKE_STORAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python azure/scripts/package_function.py
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_NAME }}
          package: azure/function.zip
          sku: flexconsumption
          remote-build: true
      - name: Install smoke-test dependencies
        run: python -m pip install -r azure/functions/requirements.txt
      - name: Live authenticated HTTP ingestion and lake integrity test
        run: python azure/scripts/smoke_http.py
      - name: Retain HTTP smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-smoke-${{ github.run_id }}
          path: azure/http-smoke-result.json
          if-no-files-found: ignore
          retention-days: 7
